name: Android CI Build & Test

on:
  push:
    branches: [ main, android-restoration ]
  pull_request:
    branches: [ main, android-restoration ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run unit tests
      run: ./gradlew clean testDebugUnitTest --continue

    - name: Build Debug APKs
      run: ./gradlew assembleDebug

    - name: Verify APKs Exist (Fail If Missing)
      run: |
        echo "=== Verifying Generated APK Files ==="
        find . -type f -name "*.apk" -print
        
        if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "::error::Controller APK not found at app/build/outputs/apk/debug/app-debug.apk"
          exit 1
        fi
        
        if [ ! -f "demo-module/build/outputs/apk/debug/demo-module-debug.apk" ]; then
          echo "::error::Target Demo APK not found at demo-module/build/outputs/apk/debug/demo-module-debug.apk"
          exit 1
        fi
        
        echo "Controller APK size: $(ls -lh app/build/outputs/apk/debug/app-debug.apk | awk '{print $5}')"
        echo "Demo module APK size: $(ls -lh demo-module/build/outputs/apk/debug/demo-module-debug.apk | awk '{print $5}')"
        echo "Both APKs exist and verified."

    - name: Upload Controller APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Target Demo APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-module-debug-apk
        path: demo-module/build/outputs/apk/debug/demo-module-debug.apk
